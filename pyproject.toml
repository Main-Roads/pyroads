[build-system]
requires = [
  "setuptools >= 40.9.0",
  "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "pyroads"
version = "0.4.0"
description = "Tools for analysis of road asset data"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "Shaan Ciantar"},
  { name = "Nicholas Archer"},
  { name = "Dagmawi Tadesse", email = "dagmawi.tadesse@mainroads.wa.gov.au" },
]
maintainers = [
  { name = "Dagmawi Tadesse", email = "dagmawi.tadesse@mainroads.wa.gov.au" },
]
requires-python = ">=3.10"
dependencies = [
  "pandas",
  "numpy",
  "numba>=0.57",
  "deprecated",
  "requests",
]

[project.optional-dependencies]
polars = ["polars"]
dask = ["dask[dataframe]"]
dev = ["pytest", "pre-commit", "ruff", "pyright"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.pyright]
include = ["src"]
exclude = ["**/__pycache__", "examples"]
typeCheckingMode = "basic"
reportMissingImports = false
reportMissingTypeStubs = false

[tool.pytest.ini_options]
addopts = "-q"
markers = [
  "slow: marks tests that take longer to run",
]
testpaths = [
    "test"
]
[build-system]
requires = [
  "setuptools >= 40.9.0",
  "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "pyroads"
version = "0.4.0"
description = "Tools for analysis of road asset data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas",
  "numpy",
  "numba>=0.57",
  "deprecated",
  "requests",
]

[project.optional-dependencies]
polars = ["polars"]
dask = ["dask[dataframe]"]
dev = ["pytest"]

[tool.pytest.ini_options]
addopts = "-q"
markers = [
  "slow: marks tests that take longer to run",
]
testpaths = [
    "test"
]